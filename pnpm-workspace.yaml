# Workspace settings: one package, installed with the rules below.
packages:
  - '.'
allowBuilds:
  '@swc/core': false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - vite@8.3.0
  - source-map-js@1.2.2
overrides:
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
trustPolicy: no-downgrade
blockExoticSubdeps: true
